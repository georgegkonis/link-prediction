name: Release Thesis

on:
  push:
    tags:
      - "thesis-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile thesis
        run: |
          cd latex/thesis
          xelatex -interaction=nonstopmode thesis.tex
          biber thesis
          xelatex -interaction=nonstopmode thesis.tex
          xelatex -interaction=nonstopmode thesis.tex
          mv thesis.pdf "thesis-${GITHUB_REF_NAME#thesis-}.pdf"

      - name: Compile presentation
        run: |
          cd latex/presentation
          xelatex -interaction=nonstopmode presentation.tex
          xelatex -interaction=nonstopmode presentation.tex
          mv presentation.pdf "presentation-${GITHUB_REF_NAME#thesis-}.pdf"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            latex/thesis/thesis-*.pdf
            latex/presentation/presentation-*.pdf
