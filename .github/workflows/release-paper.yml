name: Release Paper

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile thesis
        run: |
          cd latex/thesis
          xelatex -interaction=nonstopmode -jobname=thesis "\def\draftversion{${{ github.ref_name }}}\input{thesis.tex}"
          biber thesis
          xelatex -interaction=nonstopmode -jobname=thesis "\def\draftversion{${{ github.ref_name }}}\input{thesis.tex}"
          xelatex -interaction=nonstopmode -jobname=thesis "\def\draftversion{${{ github.ref_name }}}\input{thesis.tex}"

      - name: Compile presentation
        run: |
          cd latex/presentation
          xelatex -interaction=nonstopmode presentation.tex
          xelatex -interaction=nonstopmode presentation.tex

      - name: Compile paper
        run: |
          cd latex/paper
          xelatex -interaction=nonstopmode paper.tex
          biber paper
          xelatex -interaction=nonstopmode paper.tex
          xelatex -interaction=nonstopmode paper.tex

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            latex/thesis/thesis.pdf
            latex/presentation/presentation.pdf
            latex/paper/paper.pdf
