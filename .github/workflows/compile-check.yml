name: Compile Check

on:
  push:
    branches: [master]
    paths:
      - "latex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: thesis
            dir: latex/thesis
            main: thesis
            biber: true
          - name: presentation
            dir: latex/presentation
            main: presentation
            biber: false
          - name: paper
            dir: latex/paper
            main: paper
            biber: true

    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: |
          cd ${{ matrix.dir }}
          xelatex -interaction=nonstopmode ${{ matrix.main }}.tex
          if [ "${{ matrix.biber }}" = "true" ]; then biber ${{ matrix.main }}; fi
          xelatex -interaction=nonstopmode ${{ matrix.main }}.tex
          xelatex -interaction=nonstopmode ${{ matrix.main }}.tex

      - name: Check for margin overflows
        run: |
          cd ${{ matrix.dir }}
          if grep -E "Overfull \\\\hbox \([0-9]{2,}" ${{ matrix.main }}.log; then
            echo "::error::Overfull hbox of 10pt+ found — content is spilling past the page margin. See lines above for the paragraph/line range in the .log."
            exit 1
          fi

      - name: Upload PDF preview
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-pdf-preview
          path: ${{ matrix.dir }}/${{ matrix.main }}.pdf
