name: Compile Paper

on:
  push:
    branches: [master]
    paths:
      - "paper/.version"
      - "paper/version.tex"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "number=$(cat paper/.version)" >> "$GITHUB_OUTPUT"

      - name: Compile
        run: |
          cd paper
          xelatex -interaction=nonstopmode main.tex
          biber main
          xelatex -interaction=nonstopmode main.tex
          xelatex -interaction=nonstopmode main.tex

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-v${{ steps.version.outputs.number }}
          path: paper/main.pdf
          retention-days: 90
