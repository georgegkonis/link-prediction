name: Compile Paper

on:
  push:
    branches: [master]
    paths:
      - "paper/.version"
      - "paper/version.tex"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "number=$(cat paper/.version)" >> "$GITHUB_OUTPUT"

      - name: Compile
        run: |
          cd paper
          xelatex -interaction=nonstopmode main.tex
          biber main
          xelatex -interaction=nonstopmode main.tex
          xelatex -interaction=nonstopmode main.tex

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: paper-v${{ steps.version.outputs.number }}
          name: "Draft v${{ steps.version.outputs.number }}"
          files: paper/main.pdf
