defaults:
  - model: cascade
  - training: default
  - features: default
  - _self_

paths:
  raw: data/raw/dsaa
  interim: data/interim/dsaa
  checkpoints: outputs/checkpoints/dsaa
  predictions: outputs/predictions/dsaa
  log_path: outputs/predictions/dsaa/kaggle_scores.csv

kaggle:
  competition: dsaa-2023-competition

seed: 42

dev:
  nrows: null
  skip_st: false
  skip_pos: false

hydra:
  run:
    dir: .
  job_logging:
    handlers:
      file:
        filename: logs/${hydra.job.name}.log
