name: Release Paper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
      - uses: actions/checkout@v4

      - name: Write version
        run: echo '\newcommand{\draftversion}{DRAFT v${{ github.run_number }}}' > paper/version.tex

      - name: Compile
        run: |
          cd paper
          xelatex -interaction=nonstopmode main.tex
          biber main
          xelatex -interaction=nonstopmode main.tex
          xelatex -interaction=nonstopmode main.tex

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: paper-v${{ github.run_number }}
          name: "Draft v${{ github.run_number }}"
          files: paper/main.pdf
